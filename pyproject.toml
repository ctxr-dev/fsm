[project]
name = "ctxr-fsm"
version = "0.1.0a1"
description = "SQLite-backed Python FSM substrate for deterministic LLM-orchestrated workflows."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["fsm", "state-machine", "orchestration", "agentic", "workflow", "llm", "claude", "mcp", "sqlite"]
authors = [{ name = "ctxr-dev" }]
dependencies = [
  "pydantic>=2.7",
  "uuid-utils>=0.9",
  "typer>=0.12",
  "rich>=13.7",
  "anyio>=4.4",
  "watchfiles>=0.22",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sse-starlette>=2.1", "httpx>=0.27"]
sqlite = [
    "sqlalchemy>=2.0",
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
]
all  = ["ctxr-fsm[mcp,api,sqlite]"]

[project.scripts]
ctxr-fsm = "ctxr.fsm.cli:app"

[project.urls]
Homepage = "https://github.com/ctxr-dev/fsm"
Issues = "https://github.com/ctxr-dev/fsm/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctxr"]

[tool.hatch.build]
include = ["ctxr/**/*.py", "ctxr/**/*.md", "README.md", "LICENSE"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "hypothesis>=6.112",
  "types-jsonschema>=4.23",
]

[tool.uv]
managed = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["ctxr.fsm"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# SQLModel + mypy: ORM column descriptors (e.g. `SomeTable.id`) are typed
# as their Python value type (str/int/bool) rather than InstrumentedAttribute[T]
# / Mapped[T], so every `column == "literal"` expression looks like a bare
# `bool` to mypy and gets flagged across query call-sites. Migrating every
# table to SQLAlchemy 2.0 Mapped[T] annotations would fix this but is a
# separate model rewrite. Until then, suppress ONLY the codes caused by this
# friction in the four repository modules where it appears.
module = [
    "ctxr.fsm.sqlite.repos_core",
    "ctxr.fsm.sqlite.repos_states",
    "ctxr.fsm.sqlite.repos_events",
    "ctxr.fsm.sqlite.repos_locks_journal",
    "ctxr.fsm.sqlite.repos_enforcement",
]
disable_error_code = ["arg-type", "attr-defined", "union-attr", "operator", "call-overload"]

[[tool.mypy.overrides]]
# CLI modules that hand-roll SQLAlchemy queries against the W2 SQLModel
# tables hit the same descriptor-as-value friction described above — the
# export/import round-trip needs ``select(Table).where(Table.col == x)``
# clauses outside the repository layer, and ``spec.validate()`` is a
# monkey-patched method whose return type mypy cannot reconcile against
# the BaseModel.validate classmethod it shadows. Suppress ONLY the codes
# those two issues produce; everything else in the CLI is strictly typed.
module = [
    "ctxr.fsm.cli.export_cmd",
    "ctxr.fsm.cli.import_cmd",
    "ctxr.fsm.cli.spec_cmd",
]
disable_error_code = ["arg-type", "attr-defined", "union-attr", "call-overload", "call-arg"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
